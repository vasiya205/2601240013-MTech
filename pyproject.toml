[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnerability-prioritization-engine"
version = "0.1.0"
description = "Risk-based security remediation prioritization engine"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "streamlit>=1.35.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
]

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
pythonpath = ["."]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
